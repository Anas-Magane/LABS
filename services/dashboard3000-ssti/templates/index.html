<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueOffice | Staff Login</title>
  <style>
    :root {
      --navy: #0a1628; --navy-2: #0f2137; --surface: #16233a; --text: #e6edf5;
      --text-dim: #94a7bf; --accent: #38bdf8; --accent-2: #2563eb; --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--navy); color: var(--text); display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
    .box { background: var(--surface); border: 1px solid var(--border); padding: 2.4rem;
           border-radius: 12px; width: 340px; box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
    .brand { display: flex; align-items: center; gap: 0.55rem; font-weight: 700; margin-bottom: 1.4rem; }
    .brand .mark { width: 24px; height: 24px; border-radius: 6px;
           background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    h2 { font-size: 1.15rem; margin: 0 0 1.4rem; font-weight: 600; }
    label { display: block; font-size: 0.78rem; color: var(--text-dim); margin: 0 0 0.3rem; }
    input { width: 100%; padding: 10px; margin: 0 0 1rem; box-sizing: border-box;
            background: var(--navy-2); border: 1px solid var(--border); border-radius: 6px;
            color: var(--text); font-size: 0.9rem; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; padding: 10px; background: var(--accent-2); color: white; border: none;
             border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    button:hover { background: #1d4ed8; }
    #err { color: #f87171; min-height: 1.2em; font-size: 0.85rem; margin-top: 0.7rem; }
    .footnote { color: var(--text-dim); font-size: 0.75rem; margin-top: 1.4rem; text-align: center; }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand"><span class="mark"></span> BlueOffice</div>
    <h2>Staff Portal Sign In</h2>
    <label for="user">Username</label>
    <input id="user" type="text" placeholder="Username" autocomplete="off">
    <label for="pass">Password</label>
    <input id="pass" type="password" placeholder="Password" autocomplete="off">
    <button onclick="doLogin()">Sign In</button>
    <div id="err"></div>
    <div class="footnote">Legacy staff login &middot; SSO migration in progress</div>
  </div>

  <script>
    // NOTE: this is a legacy login screen pending migration to the SSO
    // backend. Authentication is currently performed client-side only.
    function doLogin() {
      var user = document.getElementById('user').value;
      var password = document.getElementById('pass').value;

      if (user == "admin" && password == "admin123456789876543212345678987654321234567898765432123456789") {
        localStorage.setItem("blueoffice_auth", "true");
        window.location.href = "/dashboard";
      } else {
        document.getElementById('err').innerText = "Invalid credentials";
      }
    }
  </script>
</body>
</html>
