<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login - FST School Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; margin: 0; }
    nav { background: #003366; padding: 1rem 2rem; }
    nav a { color: white; margin-right: 1.5rem; text-decoration: none; font-weight: bold; }
    .box { max-width: 380px; margin: 4rem auto; background: white; padding: 2rem;
           border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.08); }
    input { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #003366; color: white; border: none;
             border-radius: 4px; cursor: pointer; }
    .error { color: #c0392b; min-height: 1.2em; }
    .welcome { color: #27ae60; min-height: 1.2em; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
  </nav>
  <div class="box">
    <h2>Student / Staff Login</h2>
    <form method="post" action="/login">
      <input type="text" name="username" placeholder="Username or Email" autocomplete="off">
      <input type="password" name="password" placeholder="Password" autocomplete="off">
      <button type="submit">Login</button>
    </form>
    <div class="error">{{ error or '' }}</div>
    {% if welcome %}<div class="welcome">Welcome, {{ welcome }}!</div>{% endif %}
  </div>
</body>
</html>
