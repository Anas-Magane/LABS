<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>System Time Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #101820; color: #e0e1dd; display: flex;
           align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #1b2733; padding: 2.5rem 3rem; border-radius: 8px; text-align: center; }
    h1 { margin: 0 0 0.5rem 0; font-weight: 400; }
    .clock { font-size: 2.2rem; letter-spacing: 1px; }
    .date { color: #9fb3c8; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>System Time Viewer</h1>
    <div class="clock">{{ time }}</div>
    <div class="date">{{ date }}</div>
  </div>
</body>
</html>
