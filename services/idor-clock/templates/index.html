<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Time Viewer</title>
  <style>
    :root { --bg: #101820; --surface: #1b2733; --text: #e0e1dd; --text-dim: #9fb3c8; --border: rgba(255,255,255,0.06); }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg);
           color: var(--text); display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; }
    .box { background: var(--surface); border: 1px solid var(--border); padding: 2.6rem 3.2rem;
           border-radius: 10px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    h1 { margin: 0 0 1rem 0; font-weight: 500; font-size: 1rem; color: var(--text-dim);
         text-transform: uppercase; letter-spacing: 0.08em; }
    .clock { font-size: 2.4rem; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .date { color: var(--text-dim); margin-top: 0.4rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>System Time Viewer</h1>
    <div class="clock">{{ time }}</div>
    <div class="date">{{ date }}</div>
  </div>
</body>
</html>
