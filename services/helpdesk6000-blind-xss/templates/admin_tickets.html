<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueOffice | Ticket Queue</title>
  <style>
    :root { --navy: #12122a; --navy-2: #191933; --surface: #1c1c3a; --text: #eaeaea;
            --text-dim: #9797c2; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--navy); color: var(--text); }
    header { background: var(--navy-2); border-bottom: 1px solid var(--border); padding: 1rem 2rem;
             display: flex; justify-content: space-between; align-items: center; }
    header a { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; margin-left: 1rem; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.6rem 0.4rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-dim); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    a.tlink { color: #7fdbff; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <strong>Ticket Queue</strong>
    <div><a href="/admin/flag">Flag</a><a href="/admin/logout">Log out</a></div>
  </header>
  <div class="wrap">
    <table>
      <tr><th>ID</th><th>Subject</th><th>From</th><th>Submitted</th></tr>
      {% for t in tickets %}
      <tr>
        <td>#{{ t.id }}</td>
        <td><a class="tlink" href="/admin/tickets/{{ t.id }}">{{ t.subject }}</a></td>
        <td>{{ t.name }}</td>
        <td>{{ t.created_at }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">No open tickets.</td></tr>
      {% endfor %}
    </table>
  </div>
</body>
</html>
