<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueOffice | Admin Panel</title>
  <style>
    :root {
      --navy: #12122a; --surface: #1c1c3a; --text: #eaeaea; --text-dim: #9797c2;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--navy); color: var(--text); display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
    .box { background: var(--surface); border: 1px solid var(--border); padding: 2.2rem;
           border-radius: 12px; width: 480px; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
    h2 { font-size: 1.1rem; margin: 0 0 0.8rem; font-weight: 600; }
    p { font-size: 0.9rem; color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="box">
    <h2>Admin Panel</h2>
    <p>Welcome, {{ username }}.</p>
    <p>flag13: CTF{WeAK_JWT_PA55_ByP4SS}</p>
  </div>
</body>
</html>
