<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueOffice | Your Token</title>
  <style>
    :root {
      --navy: #12122a; --navy-2: #191933; --surface: #1c1c3a; --text: #eaeaea;
      --text-dim: #9797c2; --accent: #7fdbff; --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--navy); color: var(--text); display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
    .box { background: var(--surface); border: 1px solid var(--border); padding: 2.2rem;
           border-radius: 12px; width: 480px; word-break: break-all; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
    h2 { font-size: 1.1rem; margin: 0 0 0.6rem; font-weight: 600; }
    p { color: var(--text-dim); font-size: 0.88rem; }
    code { display: block; background: #0f172a; padding: 1rem; border-radius: 6px; margin-top: 0.75rem;
           font-size: 0.8rem; border: 1px solid var(--border); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="box">
    <h2>Welcome, {{ username }}</h2>
    <p>Your session token:</p>
    <code>{{ token }}</code>
    <p><a href="/admin">Go to Admin Panel</a></p>
  </div>
</body>
</html>
