<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueOffice | Kudos #{{ kudos.id }}</title>
  <style>
    :root { --bg: #16131f; --panel: #201c2e; --accent-2: #3a2e57; --text: #f1eefc;
            --text-dim: #ab9fcf; --border: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--bg); color: var(--text); }
    header { background: var(--accent-2); border-bottom: 1px solid var(--border); padding: 1rem 2rem;
             display: flex; justify-content: space-between; align-items: center; }
    header a { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 2rem; }
    .meta { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 1rem; }
    .preview { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
               padding: 1.4rem; font-size: 0.9rem; line-height: 1.5; }
    form.approve { margin-top: 1rem; }
    button { background: var(--accent-2); color: #ffb86b; border: 1px solid var(--border);
             padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <strong>Kudos #{{ kudos.id }} - for {{ kudos.recipient }}</strong>
    <a href="/manager/queue">Back to queue</a>
  </header>
  <div class="wrap">
    <div class="meta">From {{ kudos.sender }} - {{ kudos.created_at }}</div>
    <!--
      NOTE (internal): kudos cards support emoji/GIF embeds so this
      preview renders exactly as it will look on the public wall -
      hence the raw render below.
    -->
    <div class="preview">{{ kudos.message | safe }}</div>
    <form class="approve" method="post" action="/manager/queue/{{ kudos.id }}/approve">
      <button type="submit">Approve & publish to wall</button>
    </form>
  </div>
</body>
</html>
