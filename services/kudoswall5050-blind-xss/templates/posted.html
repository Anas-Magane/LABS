<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlueOffice | Kudos Posted</title>
  <style>
    :root { --bg: #16131f; --panel: #201c2e; --text: #f1eefc; --text-dim: #ab9fcf; --border: rgba(255,255,255,0.08); }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--bg); color: var(--text); display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
    .box { background: var(--panel); border: 1px solid var(--border); padding: 2.2rem;
           border-radius: 12px; width: 440px; text-align: center; }
    h2 { font-size: 1.1rem; margin: 0 0 0.6rem; }
    p { font-size: 0.85rem; color: var(--text-dim); }
    a { color: #ffb86b; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Kudos #{{ kudos_id }} submitted</h2>
    <p>Pending HR manager review before it appears on the wall.</p>
    <p><a href="/">Back to Kudos Wall</a></p>
  </div>
</body>
</html>
