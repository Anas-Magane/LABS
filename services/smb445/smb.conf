; BlueOffice Breach - Challenge 5: SMB (port 445)
; Public is open to anonymous/guest access. HR, IT, Backups and Secret
; all require a valid local account (Adam / password123 - intentionally
; weak so it is brute-forceable with common tools).

[global]
   workgroup = BLUEOFFICE
   server string = BlueOffice File Server
   netbios name = BLUEOFFICE-SRV
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2
   server max protocol = SMB3
   log file = /var/log/samba/log.%m
   max log size = 50
   dns proxy = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   smb ports = 445

[Public]
   path = /srv/samba/public
   comment = Public share - anonymous access
   browseable = yes
   read only = yes
   guest ok = yes
   force user = nobody

[HR]
   path = /srv/samba/hr
   comment = Human Resources (restricted)
   browseable = yes
   read only = yes
   guest ok = no
   valid users = Adam

[IT]
   path = /srv/samba/it
   comment = IT department (restricted)
   browseable = yes
   read only = yes
   guest ok = no
   valid users = Adam

[Backups]
   path = /srv/samba/backups
   comment = Backups (restricted)
   browseable = yes
   read only = yes
   guest ok = no
   valid users = Adam

[Secret]
   path = /srv/samba/secret
   comment = Restricted - authorized personnel only
   browseable = yes
   read only = yes
   guest ok = no
   valid users = Adam
