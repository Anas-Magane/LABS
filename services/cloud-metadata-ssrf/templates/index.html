<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BlueOffice Report Generator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; margin: 0; }
    .box { max-width: 640px; margin: 3rem auto; background: white; padding: 2rem;
           border-radius: 8px; box-shadow: 0 0 8px rgba(0,0,0,0.08); }
    input[type=text] { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
    button { padding: 10px 18px; background: #003366; color: white; border: none;
             border-radius: 4px; cursor: pointer; }
    .error { color: #c0392b; margin-top: 1rem; }
    pre.preview { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 4px;
                  margin-top: 1rem; white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="box">
    <h1>BlueOffice Report Generator</h1>
    <p>Paste a URL below and we'll generate a quick preview report of its contents.</p>
    <form method="post">
      <input type="text" name="url" placeholder="https://example.com" value="{{ url }}">
      <button type="submit">Generate Preview</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if preview %}<pre class="preview">{{ preview }}</pre>{% endif %}
  </div>
</body>
</html>
